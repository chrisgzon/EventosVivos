version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: eventosvivos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventosvivos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/EventosVivos.Api/Dockerfile
    container_name: eventosvivos_api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=eventosvivos;Username=postgres;Password=postgres"
      AllowedOrigins__0: "http://localhost:4200"
    depends_on:
      - postgres

volumes:
  pgdata:
